name: Trigger auto deployment for event-bookings

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/event-bookings-AutoDeployTrigger-433e9760-8bed-4471-bc28-96b4a5b2e3a9.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.EVENTBOOKINGS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.EVENTBOOKINGS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.EVENTBOOKINGS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: vatsalm707.azurecr.io
          registryUsername: ${{ secrets.EVENTBOOKINGS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.EVENTBOOKINGS_REGISTRY_PASSWORD }}
          containerAppName: event-bookings
          resourceGroup: event-booking
          imageToBuild: vatsalm707.azurecr.io/event-bookings:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


